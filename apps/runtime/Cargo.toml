[package]
name = "appytappy-runtime"
description = "The always-on AppyTappy background program."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Runs each automation's actions and undoes them after.
appytappy-actions = { version = "=0.1.0", path = "../../crates/actions" }
appytappy-config = { version = "=0.1.0", path = "../../crates/config" }
# Decides when each automation fires from the values the runtime reads.
appytappy-engine = { version = "=0.1.0", path = "../../crates/engine" }
appytappy-platform = { version = "=0.1.0", path = "../../crates/platform" }
appytappy-sources = { version = "=0.1.0", path = "../../crates/sources" }
# Provides `#[mutants::skip]` for functions no test can reach; it expands to
# nothing.
mutants = "0.0.4"

[build-dependencies]
# Compiles runtime.rc, the program's icon, and links it into the program on
# Windows.
embed-resource = "=3.0.12"
# Links the Visual C++ runtime into the program, so it starts on a PC without
# the Visual C++ Redistributable. The Universal C runtime stays a Windows DLL.
# Builds for other systems skip it.
static_vcruntime = "=3.0.0"

[lints]
workspace = true

# cargo-machete reads only the package's library and binary sources, so it
# misses build.rs, which calls embed-resource and static_vcruntime.
[package.metadata.cargo-machete]
ignored = ["embed-resource", "static_vcruntime"]
