[package]
name = "appytappy-mcp"
description = "A local MCP server that gives an AI agent read-only tools to investigate how a game stores its state."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
appytappy-config = { version = "=0.1.0", path = "../../crates/config" }
appytappy-sources = { version = "=0.1.0", path = "../../crates/sources" }
# MCP messages are JSON-RPC: serde maps tool arguments onto typed structs,
# and serde_json reads and writes each message.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
