[package]
name = "appy-tappy-workspace"
description = "Workspace root of AppyTappy; hosts the repository's standards policy tests."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

[dev-dependencies]
# The policy tests tokenize Rust syntax, including attributes inside macro
# bodies, without mistaking comments or literals for code, and read the JSON
# that Cargo, mise, and cargo-mutants write.
proc-macro2 = "=1.0.107"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
syn = { version = "=3.0.9", features = ["full"] }
# The policy tests read Cargo manifests, Cargo configuration, and the mise task
# fragment. Cargo permits explicit target source paths with arbitrary
# extensions, so the source scan parses manifests to see those compiler inputs.
toml = "=1.1.8"

# The lint wall lives at workspace scope so growth cannot silently shed it:
# every member crate (including this root package) opts in with
# `[lints] workspace = true`; tests/allow_policy.rs rejects missing opt-ins.
# Profiles are only honored in this root manifest.
[workspace]
members = ["apps/mcp", "apps/runtime", "apps/setup/src-tauri", "crates/*"]

# Member packages inherit these with `field.workspace = true`.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "GPL-3.0-only"
repository = "https://github.com/TheLunchTrae/appy-tappy"
publish = false

# Agent-optimized posture: the lint groups below are denied, and the only
# sanctioned escape is a per-site `#[expect(lint, reason = "...")]`;
# `#[allow]` is banned below.
[workspace.lints.rust]
future_incompatible = { level = "deny", priority = -1 }
# 2018-edition idioms: borrows stay visible in paths (`Formatter<'_>`, not
# `Formatter`), and unused `extern crate` items and inferable outlives bounds
# go.
rust_2018_idioms = { level = "deny", priority = -1 }
# Public API is a context budget: anything `pub` is documented and reachable,
# or it is not `pub`. Public types implement `Debug` so failures can show them;
# hand-written impls redact secrets (AGENTS.md).
missing_debug_implementations = "deny"
missing_docs = "deny"
unexpected_cfgs = "deny"
unreachable_pub = "deny"
# `unsafe` is denied, not forbidden, so the Windows adapters in
# `appytappy-sources` can call Win32 APIs (wiki/developer/Architecture.md#unsafe-code).
# Each unsafe block carries a reasoned `#[expect(unsafe_code)]` and a SAFETY
# comment; every other crate root keeps `#![forbid(unsafe_code)]`.
unsafe_code = "deny"

[workspace.lints.rustdoc]
all = { level = "deny", priority = -1 }

[workspace.lints.clippy]
# Lint groups at lower priority so the named lints below override them. The
# rust:lint gate runs with warnings denied, so `warn` here changes nothing at
# the gate; nursery is marked `warn` anyway to document lower trust, and its
# known false-positive offenders are allowed out explicitly below.
all = { level = "deny", priority = -1 }
nursery = { level = "warn", priority = -1 }
pedantic = { level = "deny", priority = -1 }

# Exceptions are visible and self-expiring or they do not exist: no bare
# `#[allow]`, ever. `#[expect]` fails the build once the lint stops firing,
# so stale exceptions cannot accumulate.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Panic-free production code: a reachable panic is an invariant the types
# failed to carry. Test code is exempt only through clippy.toml's
# `allow-*-in-tests` knobs, within the boundary AGENTS.md states.
arithmetic_side_effects = "deny"
dbg_macro = "deny"
exit = "deny"
expect_used = "deny"
indexing_slicing = "deny"
mem_forget = "deny"
panic = "deny"
string_slice = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"

# Results are handled or visibly, reasons-attached discarded. These lints see
# only `let _ =`, `.ok()`, and `map_err(|_| ...)`; AGENTS.md names the one
# sanctioned discard.
let_underscore_must_use = "deny"
map_err_ignore = "deny"
unused_result_ok = "deny"

# Program output is fallible I/O (AGENTS.md): the print macros panic when the
# stream closes. clippy.toml lets test code print to the test runner's capture.
print_stderr = "deny"
print_stdout = "deny"

# Immutable `Arc` snapshots are the permitted sharing (AGENTS.md): clone them
# with `Arc::clone` so shared ownership is visible at the call site, and share
# `Arc<str>` or `Arc<[T]>` rather than a growable buffer behind a second
# pointer.
clone_on_ref_ptr = "deny"
rc_buffer = "deny"

# Every unsafe block states why it is sound.
undocumented_unsafe_blocks = "deny"

# Dependency hygiene.
wildcard_dependencies = "deny"

# Lossy casts (truncation, wrap, sign loss) are denied by pedantic above:
# conversions go through From/TryFrom or checked methods. These two remain
# allowed: int-to-float precision loss is usually intended, and widening `as`
# casts are harmless in systems code.
cast_lossless = "allow"
cast_precision_loss = "allow"

# Known ping-pong with `unreachable_pub` (narrowing to `pub(crate)` trips
# this nursery lint); an exception forced by a lint interaction is not a real
# invariant, so the lint loses.
redundant_pub_crate = "allow"

# Deliberately relaxed lints: these style and size heuristics are poor proxies
# for wrongness and generate churn instead of findings.
enum_variant_names = "allow"
missing_const_for_fn = "allow"
needless_pass_by_value = "allow"
only_used_in_recursion = "allow"
option_if_let_else = "allow"
too_many_lines = "allow"
use_self = "allow"

[lints]
workspace = true

# Checks are part of the artifact, not just the tests: release keeps integer
# overflow checks. The lint wall forces explicit arithmetic anyway; this
# covers `#[expect]`ed sites and dependency code.
[profile.release]
overflow-checks = true

# The profile the installer ships, built by `mise run installer:build`. It
# trades a slower build for a smaller, faster program: one codegen unit and
# link-time optimization across every crate, with no symbols in the binaries.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = true
strip = true
