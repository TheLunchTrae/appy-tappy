name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The mandatory gate. Pushes to main and manual runs take the full mutation
  # sweep, split into shards: this job runs the first and the mutants job runs
  # the rest. Every other event mutation-tests only the code it changes,
  # against its base, so the checkout is not shallow. A pull request diffs
  # against the fetched base branch, not the event's base.sha. That sha can be
  # an older tip than the one the checked-out merge sits on, and a diff from it
  # would also hold everything merged to the base branch since then.
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MUTANTS_LANE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'full' || 'diff' }}
      MUTANTS_SHARD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '0/8' || '' }}
      MUTANTS_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.merge_group.base_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      # Tauri builds the setup app against the Linux webview stack here, so
      # the workspace lints and tests on this runner too.
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - name: Run the mandatory gate
        run: mise run standards:check

  # The rest of the full mutation sweep, beside the quality job's shard. Keep
  # the shard count here and in the quality job's MUTANTS_SHARD the same. Each
  # shard has to finish inside its time limit, so add shards as the sweep
  # grows.
  mutants:
    name: mutants
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/8', '2/8', '3/8', '4/8', '5/8', '6/8', '7/8']
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MUTANTS_SHARD: ${{ matrix.shard }}
      # Tasks would otherwise install every tool, not only install_args.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          install_args: rust github:sourcefrog/cargo-mutants bun
          cache: true
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Run the mutation shard
        run: mise run rust:mutants

  # AppyTappy ships for Windows only. This job proves the Rust workspace
  # lints, documents, and passes the member crates' tests on the
  # target platform, where the Windows adapters' tests run. The root package's
  # standards policy tests compare POSIX paths, so they run in `quality`.
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # Tasks would otherwise install every tool, not only install_args.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          install_args: rust github:nextest-rs/nextest bun
          cache: true
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Lint
        run: mise run rust:lint
      - name: Build documentation
        run: mise run rust:doc
      - name: Test member crates
        run: mise run rust:test:members
      # Prints the screen checks' timings on a Windows runner; it fails only
      # if a benchmark errors, never on a slow time. Lint already compiles the
      # benchmarks, so pull requests skip the run and main keeps the timings;
      # a benchmark that errors when it runs first shows up on main.
      - name: Benchmark
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: mise run rust:bench

  # Builds the runtime the installer ships and checks it against its
  # footprint targets. It runs on a runner of its own, so no build beside it
  # skews the CPU it measures.
  footprint:
    name: footprint
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          install_args: rust
          cache: true
      - name: Check the runtime's footprint
        run: mise run rust:footprint
