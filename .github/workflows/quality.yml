name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The mandatory gate. Pushes to main and manual runs take the full mutation
  # sweep, split into shards: this job runs the first and the mutants job runs
  # the rest. Every other event mutation-tests only the code it changes,
  # against its base, so the checkout is not shallow. A pull request checks
  # out its merge into the base branch's current tip, which is that merge's
  # first parent; the event's base.sha can be an older tip, and a diff from
  # it would also hold everything merged to the base branch since then.
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MUTANTS_LANE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'full' || 'diff' }}
      MUTANTS_SHARD: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '0/4' || '' }}
      MUTANTS_BASE_REF: ${{ github.event_name == 'pull_request' && 'HEAD^1' || github.event.merge_group.base_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      # Tauri builds the setup app against the Linux webview stack here, so
      # the workspace lints and tests on this runner too.
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      - name: Run the mandatory gate
        run: mise run standards:check

  # The rest of the full mutation sweep, beside the quality job's shard. Keep
  # the shard count here and in the quality job's MUTANTS_SHARD the same.
  mutants:
    name: mutants
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ['1/4', '2/4', '3/4']
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      MUTANTS_SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Run the mutation shard
        run: mise run rust:mutants

  # AppyTappy ships for Windows only. This job proves the Rust workspace
  # formats, lints, documents, and passes the member crates' tests on the
  # target platform, where the Windows adapters' tests run. The root package's
  # standards policy tests compare POSIX paths, so they run in `quality`.
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # Inline tasks are POSIX sh. mise reads this setting only from the
      # environment or global config, so CI sets it here; AGENTS.md gives the
      # same setting for Windows workstations.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: sh -c -o errexit
      # Tasks would otherwise install every tool, not only install_args.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          install_args: rust github:nextest-rs/nextest bun
          cache: true
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Check formatting
        run: mise run rust:fmt:check
      - name: Lint
        run: mise run rust:lint
      - name: Build documentation
        run: mise run rust:doc
      - name: Test member crates
        run: mise run rust:test:members
      # Prints the screen checks' timings on a Windows runner; it fails only
      # if a benchmark errors, never on a slow time.
      - name: Benchmark
        run: mise run rust:bench
