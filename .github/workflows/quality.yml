name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

# Each push to main gets its own group, so a newer merge never replaces a push
# whose diff is still waiting to be mutation-tested.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || (github.event_name == 'push' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The mandatory gate: every check but the mutation lane, which the mutants
  # jobs run in shards.
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # CI builds once, so incremental data only fills the build cache.
      CARGO_INCREMENTAL: '0'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.19'
          install: true
          cache: true
      # Tauri builds the setup app against the Linux webview stack here, so
      # the workspace lints and tests on this runner too.
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # Restores main's build, so the job reuses its dependency builds; the
      # workspace's own crates always rebuild, since the checkout is newer.
      # Only pushes to main save it, once for each set of manifests, lockfile
      # and toolchain, and from a clean build: a push to main never starts
      # from an older cache, so old dependency versions don't pile up. Pull
      # requests read main's cache and never fill it or read one another's.
      # mise installs the tools, so Cargo's bin directory stays out.
      - name: Restore the Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ github.event_name != 'push' && format('rust-{0}-{1}-', runner.os, github.job) || '' }}
      - name: Run the mandatory gate
        run: mise run standards:check:base
      - name: Drop build output the cache leaves out
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/doc target/lint-wall-probe
      - name: Save the Rust build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}

  # The diff mutation lane, one shard of the selected mutants on each runner;
  # wiki/Rust-standards.md#mutation-testing says why. The lane mutation-tests
  # only the code each event changes, so the checkout is not shallow. A pull
  # request diffs against the fetched base branch, not the event's base.sha.
  # That sha can be an older tip than the one the checked-out merge sits on,
  # and a diff from it would also hold everything merged to the base branch
  # since then. A push to main diffs against the previous tip, which with
  # squash merges is exactly the merged pull request or stack; a push with no
  # previous tip falls back to the parent commit. A manual run diffs against
  # origin/main.
  mutants:
    name: mutants ${{ strategy.job-index }}/${{ strategy.job-total }}
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The list's length sets the shard count; its values are not read.
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      CARGO_INCREMENTAL: '0'
      # Tasks would otherwise install every tool, not only install_args.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
      MUTANTS_COPY_TARGET: 'true'
      MUTANTS_SHARD: ${{ strategy.job-index }}/${{ strategy.job-total }}
      MUTANTS_BASE_REF: >-
        ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref)
        || github.event_name == 'merge_group' && github.event.merge_group.base_sha
        || github.event_name == 'push' && (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD^')
        || '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.19'
          install: true
          install_args: rust github:sourcefrog/cargo-mutants bun
          cache: true
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # Reads the quality job's cache, which holds the same Linux builds. The
      # shards never save a cache, so they can always start from an older one.
      - name: Restore the Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-quality-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-quality-
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Mutation-test the changed code
        run: mise run rust:mutants:diff

  # AppyTappy ships for Windows only. This job proves the Rust workspace
  # lints, documents, and passes the member crates' tests on the
  # target platform, where the Windows adapters' tests run. The root package's
  # standards policy tests compare POSIX paths, so they run in `quality`.
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      CARGO_INCREMENTAL: '0'
      # Tasks would otherwise install every tool, not only install_args.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.19'
          install: true
          install_args: rust github:nextest-rs/nextest bun
          cache: true
      # The same build cache setup as the quality job, kept per job.
      - name: Restore the Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ github.event_name != 'push' && format('rust-{0}-{1}-', runner.os, github.job) || '' }}
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Lint
        run: mise run rust:lint
      - name: Build documentation
        run: mise run rust:doc
      - name: Test member crates
        run: mise run rust:test:members
      # Saved before the benchmarks, whose release build pull requests never
      # reuse.
      - name: Drop build output the cache leaves out
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        shell: bash
        run: rm -rf target/doc target/lint-wall-probe
      - name: Save the Rust build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      # Prints the screen checks' timings on a Windows runner; it fails only
      # if a benchmark errors, never on a slow time. Lint already compiles the
      # benchmarks, so pull requests skip the run and main keeps the timings;
      # a benchmark that errors when it runs first shows up on main.
      - name: Benchmark
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: mise run rust:bench

  # Builds the runtime the installer ships and checks it against its
  # footprint targets. It runs on a runner of its own, so no build beside it
  # skews the CPU it measures.
  footprint:
    name: footprint
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      CARGO_INCREMENTAL: '0'
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.19'
          install: true
          install_args: rust
          cache: true
      # The same build cache setup as the quality job, kept per job.
      - name: Restore the Rust build cache
        id: rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-${{ github.job }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: ${{ github.event_name != 'push' && format('rust-{0}-{1}-', runner.os, github.job) || '' }}
      - name: Check the runtime's footprint
        run: mise run rust:footprint
      - name: Save the Rust build cache
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
