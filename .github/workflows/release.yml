name: Release

# Builds the Windows installer. A pushed v* tag attests where it was built and
# publishes it as a GitHub release. A manual run on any branch or tag keeps it
# as a test build in the run's artifacts, without an attestation. Nothing else
# starts it. docs/developer/installer.md describes the builds.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  installer:
    name: installer
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.keep.outputs.artifact-id }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The same settings as the windows job in quality.yml.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: sh -c -o errexit
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          install_args: rust bun
          cache: true
      - name: Build the installer
        env:
          INSTALLER_TAG: ${{ github.event_name == 'push' && github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise run installer:build
      # Unzipped, so the run's artifact downloads as the installer itself,
      # named for its version.
      - name: Keep the installer
        id: keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/dist/bundle/nsis/*-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: installer
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
      # The attestation signs with the run's OIDC token and is stored on the
      # repository. Only this job gets these, so the build steps cannot sign.
      id-token: write
      attestations: write
    steps:
      - name: Fetch the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.installer.outputs.artifact-id }}
          path: installer
      # Records the workflow, commit, and tag that built the installer, so
      # `gh attestation verify` can check a download against this repository.
      - name: Attest the installer
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: installer/*-setup.exe
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installer/*-setup.exe --title "AppyTappy $TAG" --generate-notes --verify-tag
