name: Release

# Builds the Windows installer. A pushed v* tag publishes it as a GitHub
# release. A manual run on any branch, or a pull request that changes the
# installer or its build, keeps it as a test build in the run's artifacts.
# docs/installer.md describes the builds.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .config/mise/conf.d/installer.toml
      - .github/workflows/release.yml
      - apps/setup/src-tauri/tauri.conf.json
      - apps/setup/src-tauri/tauri.installer.conf.json
      - apps/setup/src-tauri/windows/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: installer
    runs-on: windows-2025
    timeout-minutes: 60
    outputs:
      artifact-id: ${{ steps.keep.outputs.artifact-id }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      # The same settings as the windows job in quality.yml.
      MISE_WINDOWS_DEFAULT_INLINE_SHELL_ARGS: sh -c -o errexit
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request builds its head commit, which names the test
          # version, rather than a merge commit nobody can check out.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          install_args: rust bun
          cache: true
      - name: Build the installer
        env:
          INSTALLER_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: mise run installer:build
      # Unzipped, so the run's artifact downloads as the installer itself,
      # named for its version.
      - name: Keep the installer
        id: keep
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: target/dist/bundle/nsis/*-setup.exe
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    needs: installer
    if: github.ref_type == 'tag'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fetch the installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.installer.outputs.artifact-id }}
          path: installer
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" installer/*-setup.exe --title "AppyTappy $TAG" --generate-notes --verify-tag
