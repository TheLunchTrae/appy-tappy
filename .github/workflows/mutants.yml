name: Mutation sweep

# The full mutation sweep, nightly on main and on demand for any branch. Pull
# requests and pushes to main mutation-test only what they change, in the
# quality workflow; this sweep also catches a mutant that survives only once
# two merged changes meet. A manual run on a branch checks the whole
# workspace before it merges, which a change that only removes or weakens
# tests needs, since the diff lane selects no mutants for it.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A sweep runs to the end, and a second one for the same branch waits for it.
concurrency:
  group: mutants-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Each shard has to finish inside its time limit, so add shards as the sweep
  # grows.
  mutants:
    name: mutants
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard:
          - 0/16
          - 1/16
          - 2/16
          - 3/16
          - 4/16
          - 5/16
          - 6/16
          - 7/16
          - 8/16
          - 9/16
          - 10/16
          - 11/16
          - 12/16
          - 13/16
          - 14/16
          - 15/16
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      CARGO_INCREMENTAL: '0'
      MUTANTS_SHARD: ${{ matrix.shard }}
      MUTANTS_COPY_TARGET: 'true'
      # Tasks would otherwise install every tool, not only install_args.
      MISE_TASK_RUN_AUTO_INSTALL: 'false'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5.2.5
        with:
          version: '2026.10.19'
          install: true
          install_args: rust github:sourcefrog/cargo-mutants bun
          cache: true
      - name: Install the webview build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev
      # Reads the quality job's build cache from main and never saves one.
      # MUTANTS_COPY_TARGET has cargo-mutants copy target/ into its build
      # directories, so the baseline reuses the dependency builds.
      - name: Restore the Rust build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: rust-${{ runner.os }}-quality-${{ hashFiles('Cargo.lock', '**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: rust-${{ runner.os }}-quality-
      # The setup app's Rust side embeds the built UI, so the UI builds first.
      - name: Build the setup UI
        run: mise run ui:build
      - name: Run the mutation shard
        run: mise run rust:mutants
