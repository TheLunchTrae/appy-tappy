# Weekly version updates, grouped into one pull request per ecosystem and
# directory, each held back a week after a release so a bad one is usually
# caught upstream first. Security updates are separate and come without the
# wait. Dependabot has no mise ecosystem, so the tools in .config/mise, the
# Rust toolchain in rust-toolchain.toml and mise.lock are updated by hand:
# a toolchain bump also needs mise.lock relocked, which Dependabot can't do.
version: 2
updates:
  # Every action is pinned to a commit; Dependabot moves the pin and its
  # version comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      rust:
        patterns: ['*']
    # `windows-future` has to be the release line the `windows` crate itself
    # depends on, or its async types don't match the ones `windows` returns
    # and the Windows adapter doesn't compile. A new line moves by hand
    # together with `windows`.
    ignore:
      - dependency-name: windows-future
        update-types:
          - version-update:semver-major
          - version-update:semver-minor

  # The Markdown tooling at the root and the setup UI each have a Bun lockfile.
  - package-ecosystem: bun
    directories:
      - /
      - /apps/setup
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bun:
        patterns: ['*']
