[package]
name = "appytappy-actions"
description = "Windows actions the runtime performs when a rule fires."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
appytappy-config = { version = "=0.1.0", path = "../config" }

# Microsoft's Windows API bindings; the features select the APIs the adapter
# in `win.rs` calls: media sessions, Core Audio, COM, the process snapshot
# that names each audio session's executable, and `SendInput` for key
# presses. `windows-future` is the part of the same bindings that `windows`
# already uses for requests that finish later; naming it lets the adapter
# wait for a media request with a timeout.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Foundation_Collections",
  "Media_Control",
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Variant",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }
windows-future = "=0.3.2"

[lints]
workspace = true
