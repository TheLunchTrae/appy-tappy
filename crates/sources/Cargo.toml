[package]
name = "appytappy-sources"
description = "Windows source primitives that read app state for the runtime and the setup app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
appytappy-config.workspace = true
# Provides `#[mutants::skip]` for functions no test can reach; it expands to
# nothing.
mutants.workspace = true
# Reads and writes the PNG files that hold a screen binding's reference image;
# a hand-written decoder would need its own inflate implementation.
png = "0.18.1"

# Microsoft's Windows API bindings; the features select the APIs the adapter
# in `win.rs` and `win/capture.rs` calls. Capture uses them directly rather
# than the `windows-capture` crate, which adds its own thread pool and locks.
# `Wdk_System_SystemInformation` and `Win32_Storage_FileSystem` read an
# executable's path and file version for `win/build.rs`.
# `Win32_Graphics_Dwm` reads the size a capture frames a window at before
# the capture starts.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Foundation",
  "Wdk_System_SystemInformation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Performance",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_HiDpi",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# Generates images for the reference-image round trip, a trust boundary.
proptest.workspace = true

# Times each check and capture-to-decision latency with a small harness of
# its own, which reports percentiles. `criterion` 0.8 depends on `alloca`,
# whose build script compiles C and breaks cross-compiling to Windows.
[[bench]]
name = "screen"
harness = false

[lints]
workspace = true
