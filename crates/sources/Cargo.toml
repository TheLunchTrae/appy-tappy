[package]
name = "appytappy-sources"
description = "Windows source primitives that read game state for the runtime and the setup app."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
appytappy-config = { version = "=0.1.0", path = "../config" }
# Provides `#[mutants::skip]` for functions no test can reach; it expands to
# nothing.
mutants = "0.0.4"

# Microsoft's Windows API bindings; the features select the APIs the adapter
# in `win.rs` calls.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
