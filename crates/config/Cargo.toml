[package]
name = "appytappy-config"
description = "The saved files' formats, rules, their validation, and where the files live and how they are written."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The authoring files are JSON: serde maps them onto typed structs, and
# serde_json reads and writes the text.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"

[lints]
workspace = true
