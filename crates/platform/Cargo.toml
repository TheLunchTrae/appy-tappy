[package]
name = "appytappy-platform"
description = "The runtime's Windows host services: window events, the tray icon, single-instance guard, autostart, and the local clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Provides `#[mutants::skip]` for functions no test can reach; it expands to
# nothing.
mutants.workspace = true

# Microsoft's Windows API bindings; the features select the APIs the adapter
# in `win.rs` and `win/` calls: the window event hook and its message loop,
# the tray icon with its hidden window and menu, holding the end of the
# session while the runtime undoes its changes, the named mutex behind the
# single-instance guard, the `Run` registry key, the local clock, and
# showing a window without activating it.
[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
