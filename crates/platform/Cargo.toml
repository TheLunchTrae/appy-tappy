[package]
name = "appytappy-platform"
description = "The runtime's Windows host services: window events, single-instance guard, autostart, and the local clock."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# Provides `#[mutants::skip]` for functions no test can reach; it expands to
# nothing.
mutants = "0.0.4"

# Microsoft's Windows API bindings; the features select the APIs the adapter
# in `win.rs` calls: the window event hook and its message loop, the named
# mutex behind the single-instance guard, the `Run` registry key, and the
# local clock.
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
