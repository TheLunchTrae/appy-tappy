# Lockfile format 3, which `mise lock` writes for a new lockfile, needs at
# least this mise.
min_version = "2026.9.16"

[settings]
lockfile = true
# CI runs Linux and Windows; contributors use Windows and macOS.
lockfile_platforms = ["linux-x64", "macos-arm64", "windows-x64"]

# Inline tasks are POSIX sh on every platform. On Windows mise would run them
# with cmd, and its own inline shell setting is read only from the environment
# or the global config, so this project default covers local runs and CI alike.
# It covers tasks only, not hooks or postinstall scripts. On Linux and macOS
# it also runs simple commands that mise would otherwise start directly
# through sh.
[task_config]
shell = "sh -o errexit -c"

[tools]
gitleaks = "8"

[tasks.secrets]
description = "Scan the working tree for secrets"
run = "gitleaks dir . --redact --no-banner"

# The repository has three profiles, Rust, the setup UI and Markdown, so the
# aggregate tasks name them directly instead of detecting them from marker
# files.
[tasks.fmt]
description = "Format Rust, the setup UI and Markdown"
depends = ["rust:fmt", "ui:fmt", "md:fmt"]

[tasks."fmt:check"]
description = "Check Rust, setup UI and Markdown formatting"
depends = ["rust:fmt:check", "ui:fmt:check", "md:fmt:check"]

[tasks.lint]
description = "Lint Rust, the setup UI and Markdown"
depends = ["rust:lint", "ui:lint", "md:lint"]

[tasks.test]
description = "Run the Rust and setup UI tests"
depends = ["rust:test", "ui:test"]

[tasks.standards]
description = "Run the standards workflows and their autofixes"
depends = ["rust:standards", "ui:standards", "md:standards"]

# Secrets and hygiene check the tree before the profile gates write their
# build and probe output. The setup UI's gate runs first because it builds
# apps/setup/dist, which the setup app's Rust side embeds when it compiles.
# The CI quality job runs this base gate and CI's mutants jobs run the
# mutation lane in shards, so a long lane never holds up the rest.
[tasks."standards:check:base"]
description = "Run the standards CI gate without the mutation lane"
depends = ["secrets", "hygiene"]
run = [{ task = "ui:standards:check" }, { task = "rust:standards:check:base" }, { task = "md:standards:check" }]

[tasks."standards:check"]
description = "Run the standards CI gate"
run = [{ task = "standards:check:base" }, { task = "rust:mutants:diff" }]
