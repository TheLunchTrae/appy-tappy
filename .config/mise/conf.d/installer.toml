# The Windows installer: one per-user NSIS installer that holds the setup app
# and the runtime. Tauri's bundler builds it from
# apps/setup/src-tauri/tauri.installer.conf.json, which adds the runtime as a
# sidecar; the base tauri.conf.json leaves bundling off, so the other Rust
# tasks compile the setup app without a built runtime. wiki/Installer.md
# describes the installer and the builds CI makes.

[tasks."ocr:model"]
description = "Download the setup app's text reader model, checked against its pinned hash"
run = '''
set -eu
# The recognition model of ocrs, the setup app's text reader, which reads
# recorded readings (wiki/Setup-app.md). It is not committed: this task
# downloads it once into apps/setup/src-tauri/models, where the installer
# bundles it from, and copies it beside the debug build, where `tauri dev`
# runs the setup app. The hash pins the file, so a changed download fails
# the build instead of shipping.
url=https://ocrs-models.s3-accelerate.amazonaws.com/text-recognition.onnx
expected=86c145c2edb96c8caed5b1ebb8f44d706408922211451c309c625157dd6061c5
model=apps/setup/src-tauri/models/text-recognition.onnx
mkdir -p apps/setup/src-tauri/models
if [ ! -f "$model" ] || [ "$(sha256sum "$model" | cut -d' ' -f1)" != "$expected" ]; then
  curl -fsSL --retry 3 -o "$model.part" "$url"
  actual=$(sha256sum "$model.part" | cut -d' ' -f1)
  if [ "$actual" != "$expected" ]; then
    rm -f "$model.part"
    echo "the text reader model's SHA-256 is $actual, not the pinned $expected" >&2
    exit 1
  fi
  mv "$model.part" "$model"
fi
debug="${CARGO_TARGET_DIR:-target}/debug/models"
mkdir -p "$debug"
cp "$model" "$debug/"
'''

[tasks."installer:build"]
description = "Build the Windows installer into target/dist/bundle/nsis (Windows only)"
depends = ["ui:install", "ocr:model"]
run = '''
set -eu
# A release build, which sets INSTALLER_TAG, takes the workspace version and
# fails unless the tag names it. Any other build is a test build: it carries
# the commit it was built from, and `.dirty` when the tree had changes, so it
# is never mistaken for a release.
release=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
if [ -n "${INSTALLER_TAG:-}" ]; then
  if [ "$INSTALLER_TAG" != "v$release" ]; then
    echo "INSTALLER_TAG $INSTALLER_TAG does not name the workspace version v$release" >&2
    exit 1
  fi
  version=$release
else
  build=$(git rev-parse --short HEAD)
  [ -z "$(git status --porcelain)" ] || build="$build.dirty"
  version="$release-dev+$build"
fi
# With UPDATER_PUBLIC_KEY, the update key's public half, the setup app checks
# for updates and installs them only when they carry that key's signature
# (wiki/Installer.md#updates). Without it, the build never updates.
# A pasted key can end in a line break, which is not part of it.
set --
pubkey=$(printf '%s' "${UPDATER_PUBLIC_KEY:-}" | tr -d '[:space:]')
if [ -n "$pubkey" ]; then
  case "$pubkey" in
    *[!A-Za-z0-9+/=]*)
      echo "UPDATER_PUBLIC_KEY is not the public key that tauri signer generate writes" >&2
      exit 1
      ;;
  esac
  set -- --config src-tauri/tauri.updater.conf.json \
    --config "{\"plugins\":{\"updater\":{\"pubkey\":\"$pubkey\"}}}"
fi
host=$(rustc -vV | sed -n 's/^host: //p')
cargo build --profile dist --locked -p appytappy-runtime
mkdir -p apps/setup/src-tauri/binaries
cp target/dist/appytappy-runtime.exe "apps/setup/src-tauri/binaries/appytappy-runtime-$host.exe"
cd apps/setup
bun run tauri build --ci \
  --config src-tauri/tauri.installer.conf.json \
  --config "{\"version\":\"$version\"}" \
  "$@" \
  -- --profile dist --locked
'''

[tasks."update:sign"]
description = "Sign a release installer for the updater and write the latest.json that announces it"
run = '''
set -eu
# The release workflow runs this on a release's installer, in a job of its
# own that alone gets the update key's private half
# (wiki/Installer.md#updates). It runs the Tauri CLI by its own path, not
# through node_modules/.bin, so no other package can stand in for it
# (wiki/Installer.md#what-guards-the-key). The signature binds the version,
# which the setup app's updater requires, and latest.json, beside the
# installer, tells the updater where the release is.
installer=${UPDATE_INSTALLER:?set UPDATE_INSTALLER to the installer to sign}
tag=${INSTALLER_TAG:?set INSTALLER_TAG to the release tag}
: "${UPDATER_PUBLIC_KEY:?set UPDATER_PUBLIC_KEY to the update key public half}"
: "${TAURI_SIGNING_PRIVATE_KEY:?set TAURI_SIGNING_PRIVATE_KEY to the update key private half}"
version=${tag#v}
dir=$(cd "$(dirname "$installer")" && pwd)
name=$(basename "$installer")
(cd apps/setup && bun node_modules/@tauri-apps/cli/tauri.js signer sign --app-version "$version" "$dir/$name") >/dev/null
signature=$(cat "$dir/$name.sig")
# Both halves carry the key's 8-byte ID after a 2-byte algorithm, in the second
# line of their base64 text. A signature from another key would fail every
# update, so the release stops here instead.
key_id() {
  printf '%s' "$1" | base64 -d | sed -n 2p | base64 -d | od -An -tx1 -j2 -N8 | tr -d ' \n'
}
if [ "$(key_id "$signature")" != "$(key_id "$UPDATER_PUBLIC_KEY")" ]; then
  echo "TAURI_SIGNING_PRIVATE_KEY is not the private half of UPDATER_PUBLIC_KEY" >&2
  exit 1
fi
url="https://github.com/TheLunchTrae/appy-tappy/releases/download/$tag/$name"
printf '{\n  "version": "%s",\n  "pub_date": "%s",\n  "platforms": {\n    "windows-x86_64": { "signature": "%s", "url": "%s" }\n  }\n}\n' \
  "$version" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$signature" "$url" > "$dir/latest.json"
'''

[tasks."winget:manifest"]
description = "Write the winget manifests of a published release into artifacts/winget"
run = '''
set -eu
# Fills apps/setup/src-tauri/winget's templates for the release that
# WINGET_VERSION names, such as 0.1.0, with its installer's SHA-256 from the
# published release. wiki/Installer.md#winget says how to submit them.
version=${WINGET_VERSION:?set WINGET_VERSION to a published release, such as 0.1.0}
case "$version" in
  *[!0-9A-Za-z.+-]*) echo "WINGET_VERSION is not a version: $version" >&2; exit 1 ;;
esac
out="artifacts/winget/$version"
mkdir -p "$out"
url="https://github.com/TheLunchTrae/appy-tappy/releases/download/v$version/AppyTappy_${version}_x64-setup.exe"
curl -fsSL --retry 3 -o "$out/installer.exe" "$url"
sha=$(sha256sum "$out/installer.exe" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
rm "$out/installer.exe"
# The templates' own comments stay out; the schema line stays in.
for template in apps/setup/src-tauri/winget/*.yaml; do
  sed -e '/^# yaml-language-server/!{/^#/d;}' -e "s/{{version}}/$version/g" -e "s/{{sha256}}/$sha/g" \
    "$template" > "$out/$(basename "$template")"
done
echo "$out"
'''
