# The Windows adapters compile only on Windows, so the Linux mutation lanes
# cannot test them; the owner approved this exclusion
# (wiki/Architecture.md#portable-core-thin-windows-adapters).
# The setup app's Tauri glue (its entry point and the commands that only
# forward to the owner thread) needs a running webview, so no unit test can
# kill its mutants; the owner approved excluding it too. Its logic lives in
# the tested modules beside it.
exclude_globs = [
    "crates/*/src/win.rs",
    "crates/*/src/win/**",
    "apps/setup/src-tauri/src/main.rs",
    "apps/setup/src-tauri/src/commands.rs",
]

# The baseline times only the mutated packages' tests, while each mutant
# runs every package's tests (`--test-workspace=true`), two mutants to a
# runner. Keep this floor above how long the whole workspace's tests take
# under that load.
minimum_test_timeout = 120

# Both lanes' shards take the mutants round-robin rather than in slices, so
# each gets a share of every file's mutants. A slice holds one file's
# neighboring mutants, and a file deep in the workspace, such as the number
# reader's, rebuilds and retests every package above it for each mutant, so
# its slice runs far longer than the rest.
sharding = "round-robin"
