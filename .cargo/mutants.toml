# The Windows adapters compile only on Windows, so the Linux mutation lanes
# cannot test them; the owner approved this exclusion
# (wiki/developer/Architecture.md#portable-core-thin-windows-adapters).
# The setup app's Tauri glue (its entry point and the commands that only
# forward to the owner thread) needs a running webview, so no unit test can
# kill its mutants; the owner approved excluding it too. Its logic lives in
# the tested modules beside it.
exclude_globs = [
    "crates/*/src/win.rs",
    "crates/*/src/win/**",
    "apps/setup/src-tauri/src/main.rs",
    "apps/setup/src-tauri/src/commands.rs",
]

# cargo-mutants builds in its own copy of the tree and leaves target/ out of it
# by default, so every baseline would start cold. Copying target/ lets the
# baseline reuse the dependency builds that CI restores from its build cache.
copy_target = true
